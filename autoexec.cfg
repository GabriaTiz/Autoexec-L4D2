clear
mat_info // Check Video Resolution/hz
echo "============================="
echo "  Metalhead Autoexec [L4D2]  "
echo "============================="
echo " L4D2 "
echo " * Launch Options" : -novid -nojoy -console -w 1920 -h 1080 -freq 144 -refresh 144 -fullscreen exec autoexec.cfg
echo                    

//Video

mat_monitorgamma "1.6"
mat_monitorgamma_tv_enabled "0"
mat_grain_scale_override "0.0"

//Audio// 
volume "1"
snd_musicvolume "0.8"
voice_enable "1"
voice_scale "0.5"
windows_speaker_config "1" 

//NET
mm_dedicated_search_maxping "80"
rate "786432";		// General settings everyone should use.
cl_cmdrate "128";
cl_updaterate "128";
cl_interp_ratio "-1";
alias "lerp_0" "cl_interp 0.0; alias lerp_change lerp_16.7; echo Lerp set to 0"; 		// Definition of the five different lerp presets.
alias "lerp_16.7" "cl_interp 0.0167; alias lerp_change lerp_33.4; echo Lerp set to 16.7";
alias "lerp_33.4" "cl_interp 0.0334; alias lerp_change lerp_50.1; echo Lerp set to 33.4";
alias "lerp_50.1" "cl_interp 0.0501; alias lerp_change lerp_66.7; echo Lerp set to 50.1";
alias "lerp_66.7" "cl_interp 0.0667; alias lerp_change lerp_0; echo Lerp set to 66.7";

lerp_66.7;		// Loading of one of the five different lerp presets

//Mouse Sensitivity //
sensitivity "0.55" // Mouse sensitivity
zoom_sensitivity_ratio_mouse "1" // Zoom sensitivity

//Mouse FIX//
m_customaccel "0"
m_customaccel_exponent "0"
m_customaccel_max "0"
m_customaccel_scale "0"
m_mouseaccel1 "0"
m_mouseaccel2 "0"
m_mousespeed "0"
m_forward "0"
m_side "0"
m_pitch "0.022000"
m_yaw "0.022000"
m_filter "0"
m_rawinput "1"
joy_accelmax "0"
joy_accelscale "0"
joy_accelscalepoly "0"
joy_advanced "0"
joy_advaxisr "0"
joy_advaxisu "0"
joy_advaxisv "0"
joy_advaxisx "0"
joy_advaxisy "0"
joy_advaxisz "0"
joy_autoaimdampen "0"
joy_autoAimDampenMethod "0"
joy_autoaimdampenrange "0"
joy_axisbutton_threshold "0"
joy_cfg_preset "0"
joy_circle_correct "0"
joy_curvepoint_1 "0"
joy_curvepoint_2 "0"
joy_curvepoint_3 "0"
joy_curvepoint_4 "0"
joy_curvepoint_end "0"
joy_diagonalpov "0"
joy_display_input "0"
joy_forwardsensitivity "0"
joy_forwardthreshold "0"
joy_gamma "0"
joy_inverty "0"
joy_lowend "0"
joy_lowend_linear "0"
joy_lowmap "0"
joy_movement_stick "0"
joy_name "0"
joy_no_accel_jump "1"
joy_pitchsensitivity "0"
joy_pitchthreshold "0"
joy_response_look "0"
joy_response_look_pitch "0"
joy_response_move "0"
joy_sensitive_step0 "0"
joy_sensitive_step1 "0"
joy_sensitive_step2 "0"
joy_sidesensitivity "0"
joy_sidethreshold "0"
joy_wingmanwarrior_centerhack "0"
joy_wingmanwarrior_turnhack "0"
joy_yawsensitivity "0"
joy_yawthreshold "0"
joystick "0"
joystick_force_disabled "1"
joystick_force_disabled_set_from_options "1"
zoom_sensitivity_ratio_joystick "0"
xbox_autothrottle "0"
xbox_throttlespoof "0"
xbox_throttlebias "0"
mc_accel_band_size "0"
mc_dead_zone_radius "0"
mc_max_pitchrate "0"
mc_max_yawrate "0"
sc_enable "0"
sc_joystick_map "0"
sc_pitch_sensitivity "0"
sc_yaw_sensitivity "0"
c_maxdistance "0"
c_maxpitch "0"
c_maxyaw "0"
c_mindistance "0"
c_minpitch "0"
c_minyaw "0"
c_orthoheight "0"
c_orthowidth "0"
c_thirdpersonshoulder "0"
c_thirdpersonshoulderaimdist "0"
c_thirdpersonshoulderdist "0"
c_thirdpersonshoulderheight "0"
c_thirdpersonshoulderoffset "0"
sk_autoaim_mode "0"

//FPS//
mat_queue_mode "2" // multi-core rendering
cl_forcepreload "1" // preloads the map before joining

//Viewmodel//

cl_viewmodelfovsurvivor "60" // FOV

//Crosshair//

crosshair "1"                   // Enable crosshair
cl_colorblind "1"		// Enables colorblind mode for the crosshair only. Makes it white with a black surrounding. (Default: 0)
cl_crosshair_dynamic "0"	// Stops the crosshair from showing your bullet spread and makes it remain static instead. (Default: 1)
cl_crosshair_thickness "2"	// Controls the thickness of the crosshair. (Default: 2)
cl_crosshair_alpha "255"	// Controls the crosshair opacity. (Default: 255)
cl_crosshair_red "0"		// RED (Default: 138)
cl_crosshair_green "255"	// GREEN (Default: 182)
cl_crosshair_blue "0"	       // BLUE (Default: 220)

//Misc//

con_enable "1"
cl_autohelp "0"
cl_showhelp "0"
cl_clearhinthistory "1"
gameinstructor_enable "0"
sv_search_max_ping        "80" //# Use less or more to get better results according to your location
cl_timeout                "45" //# A workaround for server disconnecting prematurely before map load
net_graphpos "2"
cl_downloadfilter "none"
alias reloadfont "mat_setvideomode 1920 1080 1; mat_setvideomode 1920 1080 0"
reloadfont // reload custom fonts

//Captions//

cc_lang portuguese // PT-BR fix CC
closecaption "1" // NOTE: This will give a text dialogue when any sounds are heard. This can give you another form of indication if you have a horde of common infected surrounding you and are unable to hear anything else.
cc_subtitles "1" // NOTE: If enabled, will show sound effects in caption box such as "Tank in pain" and "Tank growls" and so on.

//Glows

cl_glow_survivor_r "0.0";	// Glows for when playing on the Survivor team.
cl_glow_survivor_g "1.0";
cl_glow_survivor_b "1.0";
cl_glow_survivor_vomit_r "1.0";
cl_glow_survivor_vomit_g "0.0";
cl_glow_survivor_vomit_b "1.0";
cl_glow_survivor_hurt_r "1.0";
cl_glow_survivor_hurt_g "1.0";
cl_glow_survivor_hurt_b "0.0";
cl_glow_item_r "1.0";
cl_glow_item_g "1.0";
cl_glow_item_b "1.0";
cl_glow_item_far_r "1.0";
cl_glow_item_far_g "1.0";
cl_glow_item_far_b "1.0";
cl_glow_thirdstrike_item_r "1.0";
cl_glow_thirdstrike_item_g "0.0";
cl_glow_thirdstrike_item_b "0.0";
cl_glow_ability_r "1.0";
cl_glow_ability_g "0.0";
cl_glow_ability_b "0.0";

cl_glow_infected_r "0.0";	// Glows for when playing on the Infected team.
cl_glow_infected_g "1.0";
cl_glow_infected_b "1.0";
cl_glow_ghost_infected_r "1.0";
cl_glow_ghost_infected_g "1.0";
cl_glow_ghost_infected_b "1.0";
cl_glow_infected_vomit_r "1.0";
cl_glow_infected_vomit_g "0.0";
cl_glow_infected_vomit_b "1.0";
cl_glow_survivor_health_include_buffer "1";		// Controls whether any temporary health buffer will affect the color of the survivor glows or only permanent health. (Default: "1")
cl_glow_survivor_health_bleed_pulse "0";		// Disables pulsating glows. Normally in effect when the survivors have any temporary health. (Default: "1")
cl_glow_survivor_health_bleed_pulse_amount "0.3";
cl_glow_survivor_health_bleed_pulse_speed "10";
cl_glow_survivor_health_high_r "0.0";
cl_glow_survivor_health_high_g "1.0";
cl_glow_survivor_health_high_b "0.0";
cl_glow_survivor_health_med_r "1.0";
cl_glow_survivor_health_med_g "1.0";
cl_glow_survivor_health_med_b "0.0";
cl_glow_survivor_health_low_r "1.0";
cl_glow_survivor_health_low_g "0.3";
cl_glow_survivor_health_low_b "0.0";
cl_glow_survivor_health_crit_r "1.0";
cl_glow_survivor_health_crit_g "0.0";
cl_glow_survivor_health_crit_b "0.0";

//Binds//

unbindall
bind "ESCAPE" "cancelselect"
bind "`" "toggleconsole"
bind "START" "gameui_activate"
bind "TAB" "+showscores"
bind "SPACE" "+jump"
bind "0" "slot10"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "e" "+use"
bind "f" "impulse 100"
bind "h" "motd"
bind "m" "chooseteam"
bind "v" "+voicerecord"
bind "q" "lastinv"
bind "r" "+reload"
bind "s" "+back"
bind "t" "impulse 201"
bind "u" "messagemode2"
bind "w" "+forward"
bind "x" "+mouse_menu QA"
bind "y" "messagemode"
bind "z" "+mouse_menu Orders"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "F1" "Vote Yes"
bind "F2" "Vote No"
bind "F5" "jpeg"
bind "MWHEELDOWN" "invnext"
bind "MWHEELUP" "invprev"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MOUSE3" "+zoom"

//Custom Binds
alias "dc" "disconnect"
bind "V" "+voicerecord" // mic voice chat
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"

bind "F8" "exec autoexec" // RELOAD CFG

//Scoreboard+netgraph Script//
bind "TAB" "+ng"; //
alias "+ng" "+showscores; net_graph 5"
alias "-ng" "-showscores; net_graph 0"

//Toggle in-game voice + no rebinds needed
alias "disablevoice" "voice_chat"
alias "voice_chat" "chat_1"
alias "chat_1" "voice_scale 0.5; playvol buttons\blip1 0.5; echo voice on ; alias voice_chat chat_0"
alias "chat_0" "voice_scale 0.0; playvol buttons\blip2 0.5; echo voice off ; alias voice_chat chat_1"
bind "DEL" "disablevoice"

//Load confirmation//

playvol buttons\blip1 1.0 // autoexec blip
echo
sensitivity // sensitivity Check
echo
echo "============================"
echo "   Autoexec.cfg loaded!     "
echo "============================"
echo
//=====================//
//Force Autoexec//
//=====================//
host_writeconfig